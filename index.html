<!--
ALL-IN-ONE STUDENT PORTAL: this file is the whole app. Setup notes and security rules are below.

# Northfield Student Portal

Single-file app (`index.html`) + Firebase Auth, Firestore, Storage.

## 1. Firebase setup
1. Create a project at https://console.firebase.google.com
2. Build > Authentication > Sign-in method > enable **Email/Password**
3. Build > Firestore Database > Create (production mode)
4. Build > Storage > Get started
5. Project settings > Your apps > Web (</>) > copy the config into `firebaseConfig` in `index.html`
6. Publish `firestore.rules` (Firestore > Rules) and `storage.rules` (Storage > Rules)

## 2. Create the first admin (the only way to get an admin)
1. Open the app and register a normal account, verify the email.
2. In Firestore Console > `users` > your document: set `role` = `admin` and `status` = `active`.
Rules block anyone from self-registering as admin.

## 3. Run locally
Modules need http, not file://:
`python3 -m http.server 8000` then open http://localhost:8000
Add `localhost` under Authentication > Settings > Authorized domains if prompted.

## 4. Deploy
`npm i -g firebase-tools && firebase login && firebase init hosting` (public dir = this folder) then `firebase deploy`.

## Firestore structure
- `users/{uid}`: role (student|admin), status (pending|active), studentId, firstName, middleName, lastName, birthday, gender, email, course, yearLevel, section, photoURL, createdAt
- `subjects/{id}`: code, name, instructor, room, schedule, units
- `grades/{id}`: studentId (uid), subjectId, subjectCode, subjectName, instructor, prelim, midterm, final
- `announcements/{id}`: title, body, author, createdAt
Storage: `profiles/{uid}/avatar`

## Flow
Student registers, verifies email, admin approves under Students > Approve, then the student can sign in.


===== FIRESTORE RULES (Firestore Database > Rules; paste ONLY this section) =====
rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    function signedIn() { return request.auth != null; }
    function isAdmin() {
      return signedIn() && get(/databases/$(database)/documents/users/$(request.auth.uid)).data.role == 'admin';
    }
    function mark(n) { return n is number && n >= 0 && n <= 100; }

    match /users/{uid} {
      allow read: if isAdmin() || (signedIn() && request.auth.uid == uid);
      allow create: if signedIn() && request.auth.uid == uid
        && request.resource.data.role == 'student' && request.resource.data.status == 'pending';
      allow update: if isAdmin() || (signedIn() && request.auth.uid == uid
        && request.resource.data.diff(resource.data).affectedKeys()
             .hasOnly(['firstName','middleName','lastName','birthday','gender','photoURL']));
      allow delete: if isAdmin();
    }
    match /grades/{id} {
      allow read: if isAdmin() || (signedIn() && resource.data.studentId == request.auth.uid);
      allow create, update: if isAdmin() && mark(request.resource.data.prelim)
        && mark(request.resource.data.midterm) && mark(request.resource.data.final);
      allow delete: if isAdmin();
    }
    match /attendance/{id} {
      allow read: if isAdmin() || (signedIn() && resource.data.studentId == request.auth.uid);
      allow write: if isAdmin();
    }
    match /submissions/{id} {
      allow read: if isAdmin() || (signedIn() && resource.data.studentId == request.auth.uid);
      allow create: if signedIn() && request.resource.data.studentId == request.auth.uid
        && !('score' in request.resource.data);
      allow update: if isAdmin() || (signedIn() && resource.data.studentId == request.auth.uid
        && request.resource.data.diff(resource.data).affectedKeys()
             .hasOnly(['fileURL','fileName','late','submittedAt']));
      allow delete: if isAdmin();
    }
    match /notifications/{id} {
      allow read: if isAdmin() || (signedIn() && (resource.data.userId == 'all' || resource.data.userId == request.auth.uid));
      allow write: if isAdmin();
    }
    match /{col}/{id} {
      allow read: if signedIn() && col in ['subjects','announcements','assignments'];
      allow write: if isAdmin() && col in ['subjects','announcements','assignments'];
    }
  }
}

===== STORAGE RULES (Storage > Rules; paste ONLY this section) =====
rules_version = '2';
service firebase.storage {
  match /b/{bucket}/o {
    match /profiles/{uid}/{file} {
      allow read: if request.auth != null;
      allow write: if request.auth != null && request.auth.uid == uid
        && request.resource.size < 2 * 1024 * 1024 && request.resource.contentType.matches('image/.*');
    }
    match /submissions/{uid}/{file} {
      allow read: if request.auth != null;
      allow write: if request.auth != null && request.auth.uid == uid
        && request.resource.size < 10 * 1024 * 1024;
    }
  }
}

const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),st=getStorage(app);
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const list=async(c,o)=>(await getDocs(o?query(collection(db,c),orderBy(o,"desc")):collection(db,c))).docs.map(d=>({id:d.id,...d.data()}));

let me=null,page="",charts=[];
function toast(t){const e=$("#toast");e.textContent=t;e.classList.remove("hide");setTimeout(()=>e.classList.add("hide"),2600)}
function chart(id,type,labels,data,label){const c=new Chart($(id),{type,data:{labels,datasets:[{label,data,backgroundColor:["#0f5c47","#c8962b","#4cc09a","#6b8f71","#a3452f","#3b6ea5"],borderRadius:6}]},options:{plugins:{legend:{display:type!=="bar"}},scales:type==="bar"?{y:{beginAtZero:true}}:{}}});charts.push(c)}

/* ---------- theme ---------- */
const setTheme=t=>{document.documentElement.dataset.theme=t;localStorage.setItem("theme",t)};
setTheme(localStorage.getItem("theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"));
$("#themeBtn").onclick=()=>setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark");

/* ---------- auth UI ---------- */
const say=(t,ok)=>{const m=$("#msg");m.textContent=t;m.className=ok?"ok":""};
const fld=(id,l,t="text",x="")=>`<div><label for="${id}">${l}</label><input id="${id}" type="${t}" ${x}></div>`;
const pwf=(id,l)=>`<div><label for="${id}">${l}</label><div class="pw"><input id="${id}" type="password" autocomplete="off"><button type="button" data-show="${id}">Show</button></div></div>`;
function bindShow(){document.querySelectorAll("[data-show]").forEach(b=>b.onclick=()=>{const i=$("#"+b.dataset.show);i.type=i.type==="password"?"text":"password";b.textContent=i.type==="password"?"Show":"Hide"})}
function authView(mode){
  say("");const f=$("#authForm");$("#authTitle").textContent={login:"Sign in",reg:"Create student account",forgot:"Reset password"}[mode];
  if(mode==="login")f.innerHTML=fld("email","Email","email")+pwf("pw","Password")+`<br><button class="btn" style="width:100%">Sign in</button>`;
  if(mode==="forgot")f.innerHTML=fld("email","Email","email")+`<br><button class="btn" style="width:100%">Send reset link</button>`;
  if(mode==="reg")f.innerHTML=`<div class="grid2">${fld("sid","Student ID")}${fld("email","Email","email")}${fld("fn","First name")}${fld("mn","Middle name")}${fld("ln","Last name")}${fld("bd","Birthday","date")}
  <div><label>Gender</label><select id="gd"><option>Female</option><option>Male</option><option>Other</option></select></div>${fld("course","Course / Strand")}
  <div><label>Year level</label><select id="yl"><option>1</option><option>2</option><option>3</option><option>4</option></select></div>${fld("sec","Section")}${pwf("pw","Password")}${pwf("pw2","Confirm password")}</div>
  <div id="meter"><i></i></div><br><button class="btn" style="width:100%">Create account</button>`;
  $("#authLinks").innerHTML=mode==="login"?`<p><button class="link" data-m="forgot">Forgot password?</button> · <button class="link" data-m="reg">Create account</button></p>`:`<p><button class="link" data-m="login">Back to sign in</button></p>`;
  $("#authLinks").querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>authView(b.dataset.m));
  bindShow();
  if(mode==="reg")$("#pw").oninput=e=>{const v=e.target.value;const s=[/.{8,}/,/[A-Z]/,/[0-9]/,/[^A-Za-z0-9]/].filter(r=>r.test(v)).length;const i=$("#meter i");i.style.width=s*25+"%";i.style.background=["#b3261e","#b3261e","#c8962b","#6b8f71","#1b7a4b"][s]};
  f.onsubmit=async e=>{e.preventDefault();say("");try{await submitAuth(mode)}catch(err){say(err.code==="auth/email-already-in-use"?"That email already has an account.":err.code?.startsWith("auth/")?"Check your email and password and try again.":err.message)}}
}
async function submitAuth(mode){
  const v=id=>$("#"+id)?.value.trim();
  if(mode==="forgot"){await sendPasswordResetEmail(auth,v("email"));return say("Reset link sent. Check your inbox.",1)}
  if(mode==="login"){const c=await signInWithEmailAndPassword(auth,v("email"),$("#pw").value);return}
  const need=["sid","email","fn","ln","bd","course","sec"].find(k=>!v(k));if(need)return say("Fill in all required fields.");
  if(!/^\S+@\S+\.\S+$/.test(v("email")))return say("Enter a valid email address.");
  if($("#pw").value.length<8)return say("Password must be at least 8 characters.");
  if($("#pw").value!==$("#pw2").value)return say("Passwords do not match.");
  const c=await createUserWithEmailAndPassword(auth,v("email"),$("#pw").value);
  await setDoc(doc(db,"users",c.user.uid),{role:"student",status:"pending",studentId:v("sid"),firstName:v("fn"),middleName:v("mn"),lastName:v("ln"),birthday:v("bd"),gender:$("#gd").value,email:v("email"),course:v("course"),yearLevel:$("#yl").value,section:v("sec"),photoURL:"",createdAt:serverTimestamp()});
  await sendEmailVerification(c.user);await signOut(auth);authView("login");say("Account created. Verify your email, then wait for admin approval.",1);
}

onAuthStateChanged(auth,async u=>{
  charts.forEach(c=>c.destroy());charts=[];
  if(!u){me=null;$("#app").classList.add("hide");$("#auth").classList.remove("hide");return authView("login")}
  const s=await getDoc(doc(db,"users",u.uid));
  if(!s.exists()){await signOut(auth);return say("No profile found for this account.")}
  me={id:u.uid,...s.data()};
  if(me.role==="student"&&!u.emailVerified){await signOut(auth);return say("Verify your email first. Check your inbox.")}
  if(me.role==="student"&&me.status!=="active"){await signOut(auth);return say("Your registration is awaiting admin approval.")}
  $("#auth").classList.add("hide");$("#app").classList.remove("hide");$("#who").textContent=fullName(me)+" ("+me.role+")";
  const items=me.role==="admin"?["dashboard","students","subjects","grades","attendance","assignments","announcements"]:["dashboard","grades","attendance","assignments","subjects","announcements","notifications","profile"];
  $("#nav").innerHTML=items.map(i=>`<button class="nav" data-p="${i}">${i[0].toUpperCase()+i.slice(1)}</button>`).join("");
  $("#nav").querySelectorAll(".nav").forEach(b=>b.onclick=()=>go(b.dataset.p));go("dashboard");
});
$("#outBtn").onclick=()=>signOut(auth);

/* ---------- modal form ---------- */

  const m=document.createElement("div");m.id="modal";

  document.body.append(m);$("#cx").onclick=()=>m.remove();
  m.querySelector("form").onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));try{await save(d);m.remove();toast("Saved");go(page)}catch(x){toast("Could not save: "+x.message)}}

const stat=(n,l)=>`<div class="card stat"><b>${n}</b><span>${l}</span></div>`;
const myGrades=async()=>(await getDocs(query(collection(db,"grades"),where("studentId","==",me.id)))).docs.map(d=>({id:d.id,...d.data()}));

P.student_dashboard=async()=>{const g=await myGrades(),a=await list("announcements","createdAt");

const subjTable=(s,admin)=>`<div class="card wrap"><table><tr><th>Code</th><th>Name</th><th>Instructor</th><th>Room</th><th>Schedule</th><th>Units</th>${admin?"<th></th>":""}</tr>${s.map(x=>`<tr><td>${esc(x.code)}</td><td>${esc(x.name)}</td><td>${esc(x.instructor)}</td><td>${esc(x.room)}</td><td>${esc(x.schedule)}</td><td>${esc(x.units)}</td>${admin?`<td><button class="btn sm ghost" data-e="${x.id}">Edit</button> <button class="btn sm red" data-d="${x.id}">Delete</button></td>`:""}</tr>`).join("")||`<tr><td colspan=7>No subjects yet.</td></tr>`}</table></div>`;
P.student_subjects=async()=>{$("#view").innerHTML=subjTable(await list("subjects"))};
const annList=(a,admin)=>a.map(x=>`<div class="card" style="margin-bottom:12px"><h3>${esc(x.title)}</h3><small style="color:var(--mute)">${x.createdAt?.toDate?.().toLocaleDateString()||""} · Posted by ${esc(x.author)}</small><p>${esc(x.body)}</p>${admin?`<button class="btn sm ghost" data-e="${x.id}">Edit</button> <button class="btn sm red" data-d="${x.id}">Delete</button>`:""}</div>`).join("")||`<div class="card">No announcements yet.</div>`;
P.student_announcements=async()=>{$("#view").innerHTML=annList(await list("announcements","createdAt"))};
P.student_profile=async()=>{const u=me;
  $("#view").innerHTML=`<div class="card"><div class="row"><img class="ava" id="ava" alt="Profile" src="${esc(u.photoURL)}"><div><input type="file" id="pic" accept="image/*"><small style="color:var(--mute)">PNG or JPG, up to 2 MB</small></div></div>
  <form id="pf" class="grid2">${fld("fn","First name","text",`value="${esc(u.firstName)}"`)}${fld("mn","Middle name","text",`value="${esc(u.middleName)}"`)}${fld("ln","Last name","text",`value="${esc(u.lastName)}"`)}${fld("bd","Birthday","date",`value="${esc(u.birthday)}"`)}
  </form><p style="color:var(--mute)">Enrollment: ${esc(u.course)}, Year ${esc(u.yearLevel)}, Section ${esc(u.section)} · ${esc(u.email)}</p><button class="btn" id="sv">Save changes</button></div>
  <div class="card" style="margin-top:14px"><h3>Change password</h3>${pwf("np","New password")}<button class="btn" id="cp" style="margin-top:12px">Update password</button></div>`;bindShow();
  $("#sv").onclick=async()=>{await updateDoc(doc(db,"users",me.id),{firstName:$("#fn").value,middleName:$("#mn").value,lastName:$("#ln").value,birthday:$("#bd").value});Object.assign(me,{firstName:$("#fn").value,middleName:$("#mn").value,lastName:$("#ln").value,birthday:$("#bd").value});toast("Profile updated")};
  $("#pic").onchange=async e=>{const f=e.target.files[0];if(!f)return;if(f.size>2e6)return toast("Image must be under 2 MB");const r=ref(st,`profiles/${me.id}/avatar`);await uploadBytes(r,f);const url=await getDownloadURL(r);await updateDoc(doc(db,"users",me.id),{photoURL:url});me.photoURL=url;$("#ava").src=url;toast("Photo updated")};
  $("#cp").onclick=async()=>{try{await updatePassword(auth.currentUser,$("#np").value);toast("Password updated")}catch(e){toast(e.code==="auth/requires-recent-login"?"Sign in again, then retry.":"Use at least 6 characters.")}}};

/* admin */
P.admin_dashboard=async()=>{const [u,s,g]=await Promise.all([list("users"),list("subjects"),list("grades")]);const st_=u.filter(x=>x.role==="student");
  const by={};st_.forEach(x=>by[x.course]=(by[x.course]||0)+1);const pass=g.filter(x=>avg(x)>=75).length;
  $("#view").innerHTML=`<div class="cards">${stat(st_.length,"Students")}${stat(st_.filter(x=>x.status==="active").length,"Enrolled")}${stat(st_.filter(x=>x.status==="pending").length,"Pending registrations")}${stat(s.length,"Subjects")}</div>
  <div class="cards" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))"><div class="card"><h3>Students per course</h3><canvas id="c1"></canvas></div><div class="card"><h3>Passed vs failed grades</h3><canvas id="c2"></canvas></div></div>`;
  $("#view").insertAdjacentHTML("beforeend",`<div class="card" style="margin-top:14px"><h3>Example data</h3><p style="color:var(--mute)">Adds 5 sample subjects, 3 announcements, and sample grades for every approved student.</p><button class="btn" id="seed">Load example data</button></div>`);
  $("#seed").onclick=async()=>{if(!confirm("Add example subjects, announcements and grades?"))return;try{
    const subs=[["MATH101","College Algebra","Prof. Ana Reyes","Room 201","Mon/Wed 8:00-9:30",3],["ENG102","Communication Skills","Prof. Ben Cruz","Room 105","Tue/Thu 10:00-11:30",3],["CS110","Intro to Programming","Prof. Carla Lim","Lab 3","Mon/Wed 1:00-2:30",4],["SCI120","General Physics","Prof. David Tan","Room 310","Tue/Thu 1:00-2:30",3],["PE101","Physical Education","Coach Elena Diaz","Gym","Fri 9:00-11:00",2]];
    const refs=[];for(const [code,name,instructor,room,schedule,units] of subs){const d={code,name,instructor,room,schedule,units};refs.push({id:(await addDoc(collection(db,"subjects"),d)).id,...d})}
    const ann=[["Welcome to the new term","Classes begin Monday. Please check your schedule under Subjects."],["Midterm examinations","Midterms run next month. Room assignments will be posted a week before."],["Enrollment reminder","Enrollment for next term opens soon. Settle any pending requirements at the registrar."]];
    for(const [title,body] of ann)await addDoc(collection(db,"announcements"),{title,body,author:fullName(me),createdAt:serverTimestamp()});
    const marks=[[88,90,92],[82,85,80],[95,93,97],[72,70,68],[90,91,94]];
    for(const stu of st_.filter(x=>x.status==="active"))for(let i=0;i<refs.length;i++){const r=refs[i],m=marks[i];await addDoc(collection(db,"grades"),{studentId:stu.id,subjectId:r.id,subjectCode:r.code,subjectName:r.name,instructor:r.instructor,prelim:m[0],midterm:m[1],final:m[2]})}
    toast("Example data added");go("dashboard")}catch(e){toast("Failed: "+e.message)}};
  chart("#c1","bar",Object.keys(by),Object.values(by),"Students");chart("#c2","doughnut",["Passed","Failed"],[pass,g.length-pass],"")};
P.admin_students=async()=>{const all=(await list("users")).filter(x=>x.role==="student");
  $("#view").innerHTML=`<div class="row"><input id="q" placeholder="Search name or ID"><select id="fs"><option value="">All statuses</option><option>pending</option><option>active</option></select></div><div class="card wrap" id="tb"></div>`;
  const draw=()=>{const q=$("#q").value.toLowerCase(),f=$("#fs").value;const r=all.filter(x=>(!f||x.status===f)&&(fullName(x)+x.studentId).toLowerCase().includes(q));
    $("#tb").innerHTML=`<table><tr><th>ID</th><th>Name</th><th>Course</th><th>Year/Sec</th><th>Status</th><th></th></tr>${r.map(x=>`<tr><td>${esc(x.studentId)}</td><td>${esc(fullName(x))}</td><td>${esc(x.course)}</td><td>${esc(x.yearLevel)}/${esc(x.section)}</td><td><span class="tag ${x.status==="pending"?"bad":""}">${x.status}</span></td><td>${x.status==="pending"?`<button class="btn sm" data-a="${x.id}">Approve</button> `:""}<button class="btn sm ghost" data-e="${x.id}">Edit</button> <button class="btn sm red" data-d="${x.id}">Delete</button></td></tr>`).join("")||"<tr><td colspan=6>No students match.</td></tr>"}</table>`;
    $("#tb").querySelectorAll("[data-a]").forEach(b=>b.onclick=async()=>{await updateDoc(doc(db,"users",b.dataset.a),{status:"active"});toast("Approved");go("students")});
    $("#tb").querySelectorAll("[data-d]").forEach(b=>b.onclick=async()=>{if(confirm("Delete this student record?")){await deleteDoc(doc(db,"users",b.dataset.d));go("students")}});
    $("#tb").querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>{const x=all.find(y=>y.id===b.dataset.e);form("Edit student",[["firstName","First name"],["middleName","Middle name"],["lastName","Last name"],["studentId","Student ID"],["course","Course / Strand"],["yearLevel","Year level"],["section","Section"]].map(([k,l])=>({k,l,v:x[k]})),d=>updateDoc(doc(db,"users",x.id),d))})};
  $("#q").oninput=draw;$("#fs").onchange=draw;draw()};
P.admin_subjects=async()=>{const s=await list("subjects");$("#view").innerHTML=`<div class="row"><button class="btn" id="add">Add subject</button></div>`+subjTable(s,1);
  const F=x=>[["code","Code"],["name","Name"],["instructor","Instructor"],["room","Room"],["schedule","Schedule (e.g. Mon 9:00–10:30)"],["units","Units","number"]].map(([k,l,t])=>({k,l,t,v:x?.[k]}));
  $("#add").onclick=()=>form("Add subject",F(),d=>addDoc(collection(db,"subjects"),d));
  $("#view").querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>{const x=s.find(y=>y.id===b.dataset.e);form("Edit subject",F(x),d=>updateDoc(doc(db,"subjects",x.id),d))});
  $("#view").querySelectorAll("[data-d]").forEach(b=>b.onclick=async()=>{if(confirm("Delete this subject?")){await deleteDoc(doc(db,"subjects",b.dataset.d));go("subjects")}})};
P.admin_grades=async()=>{const [g,s,u]=await Promise.all([list("grades"),list("subjects"),list("users")]);const stu=u.filter(x=>x.role==="student"&&x.status==="active"),nm=id=>fullName(u.find(x=>x.id===id)||{});
  $("#view").innerHTML=`<div class="row"><button class="btn" id="add">Encode grade</button><button class="btn ghost" id="csv">Export Excel (CSV)</button><button class="btn ghost" id="pdf">Print / PDF</button></div><div class="card wrap"><table><tr><th>Student</th><th>Subject</th><th>Prelim</th><th>Midterm</th><th>Final</th><th>Avg</th><th></th></tr>${g.map(x=>`<tr><td>${esc(nm(x.studentId))}</td><td>${esc(x.subjectCode)}</td><td>${esc(x.prelim)}</td><td>${esc(x.midterm)}</td><td>${esc(x.final)}</td><td>${avg(x)}</td><td><button class="btn sm ghost" data-e="${x.id}">Edit</button> <button class="btn sm red" data-d="${x.id}">Delete</button></td></tr>`).join("")||"<tr><td colspan=7>No grades encoded.</td></tr>"}</table></div>`;
  const F=x=>[{k:"studentId",l:"Student",v:x?.studentId,o:stu.map(a=>[a.id,`${a.studentId} – ${fullName(a)}`])},{k:"subjectId",l:"Subject",v:x?.subjectId,o:s.map(a=>[a.id,`${a.code} – ${a.name}`])},...["prelim","midterm","final"].map(k=>({k,l:k[0].toUpperCase()+k.slice(1)+" (0–100)",t:"number",v:x?.[k]}))];
  const pack=d=>{const sj=s.find(a=>a.id===d.subjectId);return{studentId:d.studentId,subjectId:d.subjectId,subjectCode:sj.code,subjectName:sj.name,instructor:sj.instructor,prelim:+d.prelim,midterm:+d.midterm,final:+d.final}};
  $("#csv").onclick=()=>csv("grades.csv",[["Student","Subject","Prelim","Midterm","Final","Average"],...g.map(x=>[nm(x.studentId),x.subjectCode,x.prelim,x.midterm,x.final,avg(x)])]);$("#pdf").onclick=()=>print();$("#add").onclick=()=>form("Encode grade",F(),d=>Promise.all([addDoc(collection(db,"grades"),pack(d)),notify(d.studentId,"A new grade was posted.")]));
  $("#view").querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>{const x=g.find(y=>y.id===b.dataset.e);form("Edit grade",F(x),d=>updateDoc(doc(db,"grades",x.id),pack(d)))});
  $("#view").querySelectorAll("[data-d]").forEach(b=>b.onclick=async()=>{if(confirm("Delete this grade?")){await deleteDoc(doc(db,"grades",b.dataset.d));go("grades")}})};
P.admin_announcements=async()=>{const a=await list("announcements","createdAt");$("#view").innerHTML=`<div class="row"><button class="btn" id="add">New announcement</button></div>`+annList(a,1);
  const F=x=>[{k:"title",l:"Title",v:x?.title},{k:"body",l:"Message",t:"area",v:x?.body}];
  $("#add").onclick=()=>form("New announcement",F(),d=>Promise.all([addDoc(collection(db,"announcements"),{...d,author:fullName(me),createdAt:serverTimestamp()}),notify("all","New announcement: "+d.title)]));
  $("#view").querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>{const x=a.find(y=>y.id===b.dataset.e);form("Edit announcement",F(x),d=>updateDoc(doc(db,"announcements",x.id),d))});
  $("#view").querySelectorAll("[data-d]").forEach(b=>b.onclick=async()=>{if(confirm("Delete this announcement?")){await deleteDoc(doc(db,"announcements",b.dataset.d));go("announcements")}})};
const notify=(userId,text)=>addDoc(collection(db,"notifications"),{userId,text,createdAt:serverTimestamp()});
const mine=async c=>(await getDocs(query(collection(db,c),where("studentId","==",me.id)))).docs.map(d=>({id:d.id,...d.data()}));
const tagc=s=>`<span class="tag ${["Absent","Late"].includes(s)?"bad":""}">${s}</span>`;
const today=()=>new Date().toISOString().slice(0,10);
const csv=(name,rows)=>{const t=rows.map(r=>r.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(",")).join("\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"text/csv"}));a.download=name;a.click()};
const nmOf=(u,id)=>fullName(u.find(x=>x.id===id)||{});

P.student_attendance=async()=>{
  const a=(await mine("attendance")).sort((x,y)=>y.date.localeCompare(x.date)),c=s=>a.filter(x=>x.status===s).length;
  const rate=a.length?Math.round((c("Present")+c("Late"))/a.length*100):0;
  $("#view").innerHTML=`<div class="cards">${stat(c("Present"),"Present")}${stat(c("Absent"),"Absent")}${stat(c("Late"),"Late")}${stat(rate+"%","Attendance rate")}</div><div class="card wrap"><table><tr><th>Date</th><th>Subject</th><th>Status</th></tr>${a.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.subjectCode)}</td><td>${tagc(x.status)}</td></tr>`).join("")||"<tr><td colspan=3>No records yet.</td></tr>"}</table></div>`};

P.student_assignments=async()=>{
  const [as,sb]=await Promise.all([list("assignments","createdAt"),mine("submissions")]);
  $("#view").innerHTML=as.map(x=>{const s=sb.find(y=>y.assignmentId===x.id),sts=s?(s.score!=null?"Graded":s.late?"Late":"Submitted"):"Pending";
    return `<div class="card" style="margin-bottom:12px"><div class="row" style="justify-content:space-between;margin:0"><h3>${esc(x.title)}</h3><span class="tag ${sts==="Late"?"bad":""}">${sts}</span></div><small style="color:var(--mute)">${esc(x.subjectCode)} · Due ${esc(x.due)}</small><p>${esc(x.instructions)}</p>${s?.score!=null?`<p><b>Score: ${esc(s.score)}</b> ${esc(s.feedback||"")}</p>`:""}${s?`<a href="${esc(s.fileURL)}" target="_blank" rel="noopener">${esc(s.fileName)}</a>`:""}<div class="row" style="margin-top:10px"><input type="file" id="f${x.id}"><button class="btn sm" data-s="${x.id}">${s?"Resubmit":"Submit"}</button></div></div>`}).join("")||`<div class="card">No assignments yet.</div>`;
  $("#view").querySelectorAll("[data-s]").forEach(b=>b.onclick=async()=>{const a=as.find(y=>y.id===b.dataset.s),f=$("#f"+a.id).files[0];
    if(!f)return toast("Choose a file first");if(f.size>1e7)return toast("File must be under 10 MB");
    try{const r=ref(st,`submissions/${me.id}/${a.id}-${f.name}`);await uploadBytes(r,f);
      const data={fileURL:await getDownloadURL(r),fileName:f.name,late:today()>a.due,submittedAt:serverTimestamp()},id=`${a.id}_${me.id}`;
      sb.find(y=>y.assignmentId===a.id)?await updateDoc(doc(db,"submissions",id),data):await setDoc(doc(db,"submissions",id),{...data,assignmentId:a.id,studentId:me.id});
      toast("Submitted");go("assignments")}catch(e){toast("Upload failed: "+e.message)}})};

P.student_notifications=async()=>{
  const q=u=>getDocs(query(collection(db,"notifications"),where("userId","==",u))).then(s=>s.docs.map(d=>d.data()));
  const n=[...await q("all"),...await q(me.id)].sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
  $("#view").innerHTML=n.map(x=>`<div class="card" style="margin-bottom:10px">${esc(x.text)}<br><small style="color:var(--mute)">${x.createdAt?.toDate?.().toLocaleString()||""}</small></div>`).join("")||`<div class="card">You're all caught up.</div>`};

P.admin_attendance=async()=>{
  const [a,s,u]=await Promise.all([list("attendance"),list("subjects"),list("users")]);const stu=u.filter(x=>x.role==="student"&&x.status==="active");
  const F=x=>[{k:"studentId",l:"Student",v:x?.studentId,o:stu.map(y=>[y.id,`${y.studentId} – ${fullName(y)}`])},{k:"subjectCode",l:"Subject",v:x?.subjectCode,o:s.map(y=>[y.code,`${y.code} – ${y.name}`])},{k:"date",l:"Date",t:"date",v:x?.date||today()},{k:"status",l:"Status",v:x?.status,o:["Present","Absent","Late"].map(y=>[y,y])}];
  $("#view").innerHTML=`<div class="row"><button class="btn" id="add">Record attendance</button><input type="date" id="fd"><select id="fs"><option value="">All subjects</option>${s.map(x=>`<option>${esc(x.code)}</option>`).join("")}</select><button class="btn ghost" id="csv">Export CSV</button></div><div class="card wrap" id="tb"></div>`;
  let r=a;const draw=()=>{const d=$("#fd").value,c=$("#fs").value;r=a.filter(x=>(!d||x.date===d)&&(!c||x.subjectCode===c));
    $("#tb").innerHTML=`<table><tr><th>Date</th><th>Student</th><th>Subject</th><th>Status</th><th></th></tr>${r.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(nmOf(u,x.studentId))}</td><td>${esc(x.subjectCode)}</td><td>${tagc(x.status)}</td><td><button class="btn sm ghost" data-e="${x.id}">Edit</button> <button class="btn sm red" data-d="${x.id}">Delete</button></td></tr>`).join("")||"<tr><td colspan=5>No records.</td></tr>"}</table>`;
    $("#tb").querySelectorAll("[data-d]").forEach(b=>b.onclick=async()=>{if(confirm("Delete record?")){await deleteDoc(doc(db,"attendance",b.dataset.d));go("attendance")}});
    $("#tb").querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>{const x=a.find(y=>y.id===b.dataset.e);form("Edit attendance",F(x),d=>updateDoc(doc(db,"attendance",x.id),d))})};
  $("#add").onclick=()=>form("Record attendance",F(),d=>Promise.all([addDoc(collection(db,"attendance"),d),notify(d.studentId,`Attendance updated: ${d.status} in ${d.subjectCode}`)]));
  $("#csv").onclick=()=>csv("attendance.csv",[["Date","Student","Subject","Status"],...r.map(x=>[x.date,nmOf(u,x.studentId),x.subjectCode,x.status])]);
  $("#fd").onchange=draw;$("#fs").onchange=draw;draw()};

P.admin_assignments=async()=>{
  const [as,sb,s,u]=await Promise.all([list("assignments","createdAt"),list("submissions"),list("subjects"),list("users")]);const ti=id=>as.find(x=>x.id===id)?.title||"";
  $("#view").innerHTML=`<div class="row"><button class="btn" id="add">Create assignment</button></div><div class="card wrap"><table><tr><th>Title</th><th>Subject</th><th>Due</th><th>Submissions</th><th></th></tr>${as.map(x=>`<tr><td>${esc(x.title)}</td><td>${esc(x.subjectCode)}</td><td>${esc(x.due)}</td><td>${sb.filter(y=>y.assignmentId===x.id).length}</td><td><button class="btn sm red" data-d="${x.id}">Delete</button></td></tr>`).join("")||"<tr><td colspan=5>None yet.</td></tr>"}</table></div>
  <h3 style="margin:18px 0 10px">Submissions</h3><div class="card wrap"><table><tr><th>Student</th><th>Assignment</th><th>File</th><th>Timing</th><th>Score</th><th></th></tr>${sb.map(x=>`<tr><td>${esc(nmOf(u,x.studentId))}</td><td>${esc(ti(x.assignmentId))}</td><td><a href="${esc(x.fileURL)}" target="_blank" rel="noopener">${esc(x.fileName)}</a></td><td>${x.late?"Late":"On time"}</td><td>${esc(x.score??"–")}</td><td><button class="btn sm" data-g="${x.id}">Grade</button></td></tr>`).join("")||"<tr><td colspan=6>No submissions yet.</td></tr>"}</table></div>`;
  $("#add").onclick=()=>form("Create assignment",[{k:"title",l:"Title"},{k:"subjectCode",l:"Subject",o:s.map(y=>[y.code,`${y.code} – ${y.name}`])},{k:"instructions",l:"Instructions",t:"area"},{k:"due",l:"Deadline",t:"date"}],d=>Promise.all([addDoc(collection(db,"assignments"),{...d,createdAt:serverTimestamp()}),notify("all",`New assignment: ${d.title} (due ${d.due})`)]));
  $("#view").querySelectorAll("[data-d]").forEach(b=>b.onclick=async()=>{if(confirm("Delete this assignment?")){await deleteDoc(doc(db,"assignments",b.dataset.d));go("assignments")}});
  $("#view").querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{const x=sb.find(y=>y.id===b.dataset.g);form("Grade submission",[{k:"score",l:"Score (0–100)",t:"number",v:x.score},{k:"feedback",l:"Feedback",t:"area",v:x.feedback}],d=>Promise.all([updateDoc(doc(db,"submissions",x.id),{score:+d.score,feedback:d.feedback}),notify(x.studentId,"Your assignment was graded: "+ti(x.assignmentId))]))})};
</script>
</body>
</html>
